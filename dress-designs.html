<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f43f76"><title>تفصيل فستان | ستايل روج</title>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--pink:#f43f76;--ink:#4a1728;--muted:#8a727d;--line:#f0d8e1}*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Cairo,sans-serif;background:linear-gradient(#fff,#fff7fa);color:var(--ink);padding-top:70px}
header{position:fixed;inset:0 0 auto;height:64px;background:#fffffff2;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5%;z-index:9;backdrop-filter:blur(10px)}
header img{height:42px}.back{background:linear-gradient(145deg,#ff5a8c,#d92d62);color:#fff;padding:9px 22px;border-radius:24px;font-weight:800;text-decoration:none}
h1{font:400 40px Lalezar;text-align:center;margin:14px 0 4px}.sub{text-align:center;color:var(--muted);font-size:14px;margin-bottom:18px}
.grid{direction:ltr;max-width:1200px;margin:auto;padding:0 16px 50px;display:grid;grid-template-columns:230px 1fr 270px;gap:18px}
.grid>*{direction:rtl}.span2{grid-column:span 2}
.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:16px;box-shadow:0 12px 30px rgba(72,28,46,.06)}
.ttl{display:flex;align-items:center;gap:10px;font-weight:800;margin-bottom:14px}
.ttl i{font-style:normal;width:32px;height:32px;border-radius:50%;background:var(--pink);color:#fff;display:grid;place-items:center}
.opt{position:relative;border:2px solid transparent;background:#fff;border-radius:16px;cursor:pointer;text-align:center;font:inherit;color:inherit;padding:6px}
.opt.on{border-color:var(--pink);background:#fff6f8}.opt.on::after{content:"✓";position:absolute;top:-6px;left:-6px;background:var(--pink);color:#fff;width:22px;height:22px;border-radius:50%;font-size:12px;display:grid;place-items:center}
.pr{color:var(--pink);font-weight:800;font-size:12px}.nm{font-size:12px;font-weight:700}
.models{display:flex;flex-direction:column;gap:10px;max-height:520px;overflow:auto}
.models .opt{display:flex;align-items:center;gap:10px;text-align:right;background:#faecef}
.models img{width:70px;height:80px;object-fit:cover;border-radius:12px}
.stage{display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#ffe3ec,#fff 70%);position:relative;min-height:520px}
.stage img{max-height:430px;max-width:100%;object-fit:contain}
.arr{position:absolute;top:45%;width:44px;height:44px;border-radius:50%;border:0;background:var(--pink);color:#fff;font-size:20px;cursor:pointer}
.arr.l{left:12px}.arr.r{right:12px}
.tag{margin-top:10px;background:#fff;border-radius:24px;padding:10px 26px;font-weight:800;box-shadow:0 6px 16px rgba(0,0,0,.07);text-align:center}
.dots{display:flex;gap:6px;margin-top:10px}.dots b{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--pink)}.dots b.on{background:var(--pink)}
.colors{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dot{display:block;width:44px;height:44px;border-radius:50%;margin:0 auto 4px;border:3px solid #fff;box-shadow:0 0 0 1px #0002;object-fit:cover}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.tiles .im{display:block;width:100%;height:90px;border-radius:12px;object-fit:cover;background:#faecef;margin-bottom:4px}
.none{display:grid;place-items:center;height:90px;font-size:34px;color:var(--pink)}
.meas{display:grid;grid-template-columns:1fr 1fr;gap:10px}.meas svg{width:100%;max-width:260px;margin:auto}
.f{display:flex;align-items:center;gap:8px;margin-bottom:9px}.f label{flex:1;font-weight:700;font-size:13px}.f input{width:110px;padding:9px;border:1px solid var(--line);border-radius:12px;font:inherit}
.sum img{width:100%;max-height:200px;object-fit:contain;background:#faecef;border-radius:14px}
.row{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-bottom:1px dashed var(--line)}.row b{color:var(--pink)}
.total{display:flex;justify-content:space-between;font-size:20px;font-weight:800;margin:12px 0}.total b{color:var(--pink);font-size:26px}
.send{width:100%;border:0;border-radius:18px;padding:15px;background:linear-gradient(145deg,#ff5a8c,#d92d62);color:#fff;font:800 16px Cairo;cursor:pointer}.send:disabled{opacity:.5;cursor:not-allowed}
@media(max-width:860px){.grid{grid-template-columns:1fr}.span2{grid-column:auto}.grid>.models-card{order:2}.stage{order:1}.meas{grid-template-columns:1fr}.models{flex-direction:row;max-height:none}.models .opt{min-width:200px}}
</style></head><body>
<header><img src="logo/style-rouge.webp" alt="ستايل روج"><a class="back" href="index.html">رجوع</a></header>
<h1>صمّمي فستانك بنفسك</h1><p class="sub">اختاري كل التفاصيل التي تناسب ذوقك .. وسيتم تفصيل فستانك حسب اختياراتك</p>
<div class="grid">
 <section class="card models-card"><div class="ttl"><i>1</i>اختاري الموديل</div><div class="models" id="models"></div></section>
 <section class="card stage" id="stage"><button class="arr l" id="prev">←</button><img id="hero" alt=""><button class="arr r" id="next">→</button><div class="tag" id="tag"></div><div class="dots" id="dots"></div></section>
 <section class="card"><div class="ttl"><i>2</i>اختاري لون القماش</div><div class="colors" id="colors"></div></section>
 <section class="card span2" style="grid-column:1/2;grid-column:span 1"><div class="ttl"><i>3</i>اختاري نوع البطان</div><div class="tiles" id="fabrics"></div></section>
 <section class="card" style="grid-column:2/4"><div class="ttl"><i>4</i>اختاري الخفتان (اختياري)</div><div class="tiles" id="kaftans"></div></section>
 <section class="card" style="grid-column:1/3"><div class="ttl"><i>5</i>أدخلي المقاسات</div><div class="meas">
  <svg viewBox="0 0 200 330" fill="none" stroke="#e8708f" stroke-width="2"><path d="M70 20 Q100 45 130 20 L140 60 L118 130 L190 310 H10 L82 130 L60 60Z" fill="#ffd9e4"/><g stroke-dasharray="5 4" stroke="#d92d62"><path d="M62 52H138"/><path d="M80 90H120"/><path d="M82 130H118"/><path d="M45 245H155"/><path d="M18 20V310"/></g><g fill="#6c233d" stroke="none" font-size="11" font-family="Cairo"><text x="76" y="44">الكتف</text><text x="86" y="86">الصدر</text><text x="86" y="126">الخصر</text><text x="82" y="241">الورك</text><text x="22" y="170">الطول</text></g></svg>
  <div id="mf"></div></div></section>
 <section class="card sum" style="grid-column:3/4"><div class="ttl"><i>6</i>ملخص الطلب</div><img id="sImg" alt=""><div id="rows"></div>
  <div class="total"><span>الإجمالي</span><b id="total"></b></div><button class="send" id="send" disabled>أكملي المقاسات لإرسال الطلب</button></section>
</div>
<script src="store.js"></script>
<script>
const D=SR.load(),M=[["a","الصدر"],["b","الطول"],["c","طول الأكمام"],["d","الكتف"],["e","عرض الكم"],["f","طرف الكم"],["g","الخصر"],["h","الورك"]];
const S={m:0,color:D.colors[0]&&D.colors[0].id,fabric:D.fabrics[0]&&D.fabrics[0].id,kaftan:null};
const $=id=>document.getElementById(id),by=(a,id)=>D[a].find(x=>x.id===id),$$=SR.money;
$('mf').innerHTML=M.map(([k,n])=>`<div class="f"><label>${n} (${k})</label><input id="m-${k}" type="number" min="1" placeholder="سم"></div>`).join('');
function pick(k,id){S[k]=id;draw()}
function draw(){
 const mo=D.models[S.m]||{},co=by('colors',S.color),fa=by('fabrics',S.fabric),ka=by('kaftans',S.kaftan);
 $('models').innerHTML=D.models.map((x,i)=>`<button class="opt ${i==S.m?'on':''}" onclick="S.m=${i};draw()"><img src="${x.img}" alt=""><span><div class="nm">${x.name}</div><div class="pr">${$$(x.price)}</div></span></button>`).join('');
 $('hero').src=mo.img||'';$('tag').innerHTML=`${mo.name||''}<div class="pr" style="font-size:15px">${$$(mo.price)}</div>`;
 $('dots').innerHTML=D.models.map((_,i)=>`<b class="${i==S.m?'on':''}"></b>`).join('');
 $('colors').innerHTML=D.colors.map(x=>`<button class="opt ${x.id==S.color?'on':''}" onclick="pick('color','${x.id}')">${x.img?`<img class="dot" src="${x.img}">`:`<span class="dot" style="background:${x.hex}"></span>`}<div class="nm">${x.name}</div><div class="pr">${$$(x.price)}</div></button>`).join('');
 $('fabrics').innerHTML=D.fabrics.map(x=>`<button class="opt ${x.id==S.fabric?'on':''}" onclick="pick('fabric','${x.id}')"><img class="im" src="${x.img}" alt=""><div class="nm">${x.name}</div><div class="pr">${$$(x.price)}</div></button>`).join('');
 $('kaftans').innerHTML=`<button class="opt ${!S.kaftan?'on':''}" onclick="pick('kaftan',null)"><div class="none">⛔</div><div class="nm">بدون خفتان</div><div class="pr">${$$(0)}</div></button>`+D.kaftans.map(x=>`<button class="opt ${x.id==S.kaftan?'on':''}" onclick="pick('kaftan','${x.id}')"><img class="im" src="${x.img}" alt=""><div class="nm">${x.name}</div><div class="pr">${$$(x.price)}</div></button>`).join('');
 $('sImg').src=mo.img||'';
 const parts=[["الموديل",mo.name,mo.price],["لون القماش",co&&co.name,co&&co.price],["نوع القماش",fa&&fa.name,fa&&fa.price],["الخفتان",ka?ka.name:"بدون خفتان",ka?ka.price:0]];
 $('rows').innerHTML=parts.map(p=>`<div class="row"><span>${p[0]}: ${p[1]||'-'}</span><b>${$$(p[2])}</b></div>`).join('');
 S.total=parts.reduce((s,p)=>s+(+p[2]||0),0);S.parts=parts;$('total').textContent=$$(S.total);
}
const step=d=>{S.m=(S.m+d+D.models.length)%D.models.length;draw()};$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);
const ready=()=>M.every(([k])=>$('m-'+k).value.trim());
document.addEventListener('input',()=>{const r=ready();$('send').disabled=!r;$('send').textContent=r?'إرسال الفاتورة والطلب عبر واتساب 📲':'أكملي المقاسات لإرسال الطلب'});
$('send').onclick=()=>{
 const msg=["🧾 *فاتورة طلب تفصيل — ستايل روج*","رقم الفاتورة: SR-"+Date.now().toString().slice(-6),"",
  ...S.parts.map(p=>`${p[0]}: ${p[1]} — ${$$(p[2])}`),"","📏 *المقاسات*",
  ...M.map(([k,n])=>`${n} (${k}): ${$('m-'+k).value} سم`),"",`💰 *الإجمالي: ${$$(S.total)}*`,"✅ أريد تأكيد الطلب."].join("\n");
 window.open("https://wa.me/"+D.settings.whatsapp+"?text="+encodeURIComponent(msg),"_blank","noopener");
};
draw();
</script></body></html>
